name: tests

on:
  push:
    branches: [main]
  pull_request:

# The tests only read the repository; nothing here pushes, comments or publishes.
permissions:
  contents: read

# A new commit on the same branch or PR cancels the run still going for the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # A normal run takes 6–7 minutes (12 on a slow macOS runner); the 6-hour default only serves a hang.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      # Actions pinned to a full commit SHA (the tag stays as a comment); Dependabot bumps them.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The self-tests build their own fixture repositories and never touch this checkout's
          # history or token.
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Configure git identity for fixture repositories
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main
      - name: Shell syntax
        run: |
          bash -n telesma.sh
          for f in templates/integrations/*.sh templates/integrations/*/*/setup.sh tools/*.sh; do bash -n "$f"; done
      - name: Self-tests
        run: tools/test-all.sh
